  <body>
    <main class="landing" aria-labelledby="page-title">
      <header class="masthead">
        <a href="/" class="wordmark" aria-label="SHFFL home"><img src="assets/shffl-wordmark-dark.png" alt="SHFFL" /></a>
        <span class="location">DELHI NCR</span>
      </header>
      <svg class="journey" viewBox="0 0 1180 640" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <polyline id="journey-line" points="150,600 440,575 770,520 1050,548" fill="none" stroke="#24E0FF" stroke-width="2.6" stroke-linecap="round" opacity=".85" />
        <g class="journey-stop" data-delay="0" transform="translate(150,600)"><circle r="15" /><text y="36">EASY START</text></g>
        <g class="journey-stop" data-delay="280" transform="translate(440,575)"><circle r="24" /><text y="45">SOMEWHERE LIVELY</text></g>
        <g class="journey-stop" data-delay="560" transform="translate(770,520)"><circle r="34" /><text y="55">THE PEAK</text></g>
        <g class="journey-stop" data-delay="840" transform="translate(1050,548)"><circle r="20" /><text y="41">WIND DOWN</text></g>
      </svg>
      <section class="copy">
        <p class="eyebrow">GOING OUT IN DELHI, FROM DECEMBER</p>
        <h1 id="page-title">DRAW THE NIGHT.<br />WE FIND IT.</h1>
        <p class="body-copy">A quiet start, a room that builds, somewhere to end up. <strong>Draw the shape and SHFFL fills it in.</strong></p>
        <form class="signup" data-signup novalidate>
          <label class="sr-only" for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="your@email.com" autocomplete="email" required aria-describedby="form-status" />
          <button type="submit">JOIN THE LIST</button>
        </form>
        <p class="fine-print desktop-fine">DELHI NCR · DECEMBER 2026 · NO SPAM, OCCASIONAL SHFFL UPDATES</p>
        <p class="fine-print mobile-fine">NO SPAM · OCCASIONAL SHFFL UPDATES</p>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="script.js" defer></script>
